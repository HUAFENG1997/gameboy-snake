<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME BOY · SNAKE</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 30%, #34343e 0%, #1a1a20 55%, #0d0d11 100%);
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- 机身 ---------- */
  .device {
    position: relative;
    width: 380px;
    padding: 16px 18px 22px;
    border-radius: 18px 18px 78px 18px;
    background: linear-gradient(165deg, #f5f2e7 0%, #eae6d7 42%, #d7d1bf 100%);
    border: 1px solid #ccc6b4;
    box-shadow:
      0 30px 60px rgba(0, 0, 0, .55),
      0 6px 0 #b6b09e,
      inset 0 2px 0 rgba(255, 255, 255, .9),
      inset 0 -2px 0 rgba(0, 0, 0, .06);
    user-select: none;
    -webkit-user-select: none;
  }

  .device::before {
    content: "";
    position: absolute;
    left: 18px; right: 18px; top: 8px;
    height: 1px;
    background: #cbc5b3;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .7);
  }

  /* ---------- 屏幕外框 ---------- */
  .bezel {
    background: linear-gradient(180deg, #4d4d52 0%, #3f3f44 100%);
    border-radius: 10px 10px 34px 10px;
    padding: 12px 12px 10px;
    box-shadow:
      inset 0 2px 6px rgba(0, 0, 0, .5),
      inset 0 -1px 0 rgba(255, 255, 255, .08),
      0 1px 0 rgba(255, 255, 255, .5);
  }

  .led-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 0 8px 2px;
    height: 8px;
  }

  .led {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #d8333f;
    box-shadow: 0 0 7px #ff4b58, inset 0 -1px 1px rgba(0, 0, 0, .45);
  }

  .led-label {
    font-size: 7px;
    letter-spacing: 1.4px;
    color: #b6b1a4;
  }

  /* ---------- 液晶屏 ---------- */
  .screen {
    position: relative;
    background: #9bbc0f;
    border-radius: 4px;
    overflow: hidden;
    box-shadow:
      inset 0 0 0 2px #2e2e33,
      inset 0 0 22px rgba(15, 56, 15, .3);
  }

  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg,
      rgba(255, 255, 255, .18) 0%,
      rgba(255, 255, 255, 0) 36%,
      rgba(15, 56, 15, 0) 62%,
      rgba(15, 56, 15, .08) 100%);
  }

  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px 1px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #0f380f;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ---------- 覆盖层 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    text-align: center;
    background: rgba(155, 188, 15, .95);
    color: #0f380f;
    transition: opacity .14s linear;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .ov-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 3px;
  }

  .ov-sub {
    font-size: 10px;
    line-height: 1.9;
    letter-spacing: 1px;
    white-space: pre-line;
  }

  .blink { animation: blink 1.1s steps(1, end) infinite; }

  @keyframes blink {
    0%, 55% { opacity: 1; }
    56%, 100% { opacity: .15; }
  }

  .bezel-note {
    margin-top: 8px;
    text-align: center;
    font-size: 6.5px;
    letter-spacing: 1.8px;
    color: #a8a399;
  }

  /* ---------- LOGO ---------- */
  .logo {
    display: flex;
    align-items: baseline;
    gap: 7px;
    margin: 13px 0 0 4px;
  }

  .logo b {
    font-size: 15px;
    letter-spacing: 1.5px;
    color: #3b3f8a;
    font-weight: 800;
  }

  .logo span {
    font-size: 7.5px;
    letter-spacing: 1.6px;
    color: #857f6d;
  }

  /* ---------- 控制区 ---------- */
  .controls {
    position: relative;
    height: 150px;
    margin-top: 4px;
  }

  .dpad {
    position: absolute;
    left: 4px;
    top: 14px;
    width: 84px;
    height: 84px;
  }

  .dpad .bar {
    position: absolute;
    background: linear-gradient(180deg, #3a3a3f, #26262a);
    border-radius: 3px;
    box-shadow: 0 2px 3px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .1);
  }

  .dpad .v { left: 30px; top: 0; width: 24px; height: 84px; }
  .dpad .h { top: 30px; left: 0; width: 84px; height: 24px; }

  .dpad .hub {
    position: absolute;
    left: 33px; top: 33px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #46464c, #232327);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .12);
  }

  .dbtn {
    position: absolute;
    z-index: 2;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .dbtn:active { background: rgba(255, 255, 255, .12); border-radius: 4px; }

  .dbtn.up    { left: 28px; top: -2px; width: 28px; height: 34px; }
  .dbtn.down  { left: 28px; top: 52px; width: 28px; height: 34px; }
  .dbtn.left  { left: -2px; top: 28px; width: 34px; height: 28px; }
  .dbtn.right { left: 52px; top: 28px; width: 34px; height: 28px; }

  .ab {
    position: absolute;
    right: 6px;
    top: 24px;
    width: 112px;
    height: 78px;
  }

  .ab button {
    position: absolute;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: linear-gradient(160deg, #a13360 0%, #82244c 70%);
    color: #f2e6ee;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow:
      0 4px 0 #611838,
      0 7px 10px rgba(0, 0, 0, .35),
      inset 0 2px 2px rgba(255, 255, 255, .28);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .ab button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #611838, inset 0 2px 2px rgba(255, 255, 255, .2);
  }

  .ab .a { right: 0; top: 0; }
  .ab .b { left: 0; top: 26px; }

  .pills {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-top: 14px;
  }

  .pill {
    width: 78px;
    height: 16px;
    border: 0;
    border-radius: 8px;
    background: linear-gradient(180deg, #b3ada0, #96907f);
    color: #f4f0e3;
    font-family: inherit;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.4px;
    transform: rotate(-20deg);
    cursor: pointer;
    box-shadow: 0 3px 0 #7d7767, 0 5px 6px rgba(0, 0, 0, .25);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .pill:active {
    transform: rotate(-20deg) translateY(2px);
    box-shadow: 0 1px 0 #7d7767;
  }

  .hint {
    margin-top: 20px;
    text-align: center;
    font-size: 7.5px;
    letter-spacing: 1px;
    color: #8d8776;
  }

  @media (max-height: 690px) {
    body { padding: 12px; }
    .device { transform: scale(.86); }
  }

  @media (max-width: 420px) {
    .device { transform: scale(.9); }
  }
</style>
</head>
<body>

<div class="device">
  <div class="bezel">
    <div class="led-row">
      <span class="led"></span>
      <span class="led-label">BATTERY</span>
    </div>

    <div class="screen">
      <div class="hud">
        <span>SCORE <span id="score">0000</span></span>
        <span>HI <span id="hi">0000</span></span>
      </div>
      <canvas id="lcd" width="160" height="128"></canvas>

      <div class="overlay" id="overlay">
        <div class="ov-title" id="ovTitle">SNAKE</div>
        <div class="ov-sub" id="ovSub">方向键移动 · 吃豆变长

按 A / SPACE 开始</div>
      </div>
    </div>

    <div class="bezel-note">DOT MATRIX WITH STEREO SOUND</div>
  </div>

  <div class="logo">
    <b>GAME BOY</b>
    <span>PIXEL EDITION</span>
  </div>

  <div class="controls">
    <div class="dpad">
      <span class="bar v"></span>
      <span class="bar h"></span>
      <span class="hub"></span>
      <button class="dbtn up" data-dir="up" aria-label="上"></button>
      <button class="dbtn down" data-dir="down" aria-label="下"></button>
      <button class="dbtn left" data-dir="left" aria-label="左"></button>
      <button class="dbtn right" data-dir="right" aria-label="右"></button>
    </div>

    <div class="ab">
      <button class="a" id="btnA" aria-label="开始或暂停">A</button>
      <button class="b" id="btnB" aria-label="重开">B</button>
    </div>
  </div>

  <div class="pills">
    <button class="pill" id="btnSelect">SELECT</button>
    <button class="pill" id="btnStart">START</button>
  </div>

  <div class="hint">↑↓←→ 移动 · SPACE 开始/暂停 · R 重开 · M/SELECT 静音</div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 20;
  var ROWS = 16;
  var CELL = 8;
  var BG = '#9bbc0f';
  var INK = '#0f380f';
  var HI_KEY = 'gb-snake-hi';

  var canvas = document.getElementById('lcd');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var hiEl = document.getElementById('hi');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');

  var snake, dir, queue, food, score, stepMs;
  var state = 'ready';
  var acc = 0;
  var lastTime = 0;
  var hi = readHi();

  function readHi() {
    try {
      return parseInt(window.localStorage.getItem(HI_KEY), 10) || 0;
    } catch (err) {
      return 0;
    }
  }

  function writeHi() {
    try {
      window.localStorage.setItem(HI_KEY, String(hi));
    } catch (err) { /* 隐私模式下忽略 */ }
  }

  function pad(n) {
    return ('0000' + n).slice(-4);
  }

  function updateHud() {
    scoreEl.textContent = pad(score);
    hiEl.textContent = pad(hi);
  }

  function showOverlay(title, sub, blink) {
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    ovTitle.classList.toggle('blink', !!blink);
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
    ovTitle.classList.remove('blink');
  }

  // ---------- 音频（Web Audio 本地合成，无外部资源） ----------
  var soundOn = true;
  var audio = null;
  var musicTimer = null;
  var musicStep = 0;
  var nextNoteTime = 0;
  var STEP_DUR = 0.2; // 150 BPM 的八分音符
  var LEAD = [72, 74, 76, 79, 76, 74, 72, 74, 76, 79, 81, 79, 76, 74, 72, 0, 72, 74, 76, 79, 81, 84, 81, 79, 76, 74, 72, 74, 72, 0, 67, 0];
  var BASS = [48, 0, 55, 0, 48, 0, 55, 0, 45, 0, 52, 0, 45, 0, 52, 0, 41, 0, 48, 0, 41, 0, 48, 0, 43, 0, 50, 0, 43, 0, 50, 0];

  function midi(n) {
    return 440 * Math.pow(2, (n - 69) / 12);
  }

  function ensureAudio() {
    if (!soundOn) return null;
    if (!audio) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      var ctx = new Ctx();
      var master = ctx.createGain();
      master.gain.value = 0.4;
      master.connect(ctx.destination);
      var musicGain = ctx.createGain();
      musicGain.gain.value = 0.3;
      musicGain.connect(master);
      var sfxGain = ctx.createGain();
      sfxGain.gain.value = 0.45;
      sfxGain.connect(master);
      audio = { ctx: ctx, musicGain: musicGain, sfxGain: sfxGain };
    }
    if (audio.ctx.state === 'suspended') audio.ctx.resume();
    return audio;
  }

  function beep(freq, dur, when, dest, vol, type) {
    var osc = audio.ctx.createOscillator();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    var g = audio.ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.005);
    g.gain.setValueAtTime(vol, when + Math.max(0.006, dur * 0.7));
    g.gain.linearRampToValueAtTime(0.0001, when + dur);
    osc.connect(g);
    g.connect(dest);
    osc.start(when);
    osc.stop(when + dur + 0.01);
  }

  function sfxEat() {
    if (!ensureAudio()) return;
    var t = audio.ctx.currentTime;
    beep(midi(88), 0.06, t, audio.sfxGain, 0.14);
    beep(midi(93), 0.09, t + 0.06, audio.sfxGain, 0.14);
  }

  function sfxStart() {
    if (!ensureAudio()) return;
    var t = audio.ctx.currentTime;
    [72, 76, 79, 84].forEach(function (n, i) {
      beep(midi(n), 0.09, t + i * 0.09, audio.sfxGain, 0.2);
    });
  }

  function sfxOver() {
    if (!ensureAudio()) return;
    var t = audio.ctx.currentTime;
    [76, 72, 67, 60].forEach(function (n, i) {
      beep(midi(n), 0.16, t + i * 0.16, audio.sfxGain, 0.2);
    });
  }

  function scheduleMusicStep(step, when) {
    var lead = LEAD[step % LEAD.length];
    var bass = BASS[step % BASS.length];
    if (lead) beep(midi(lead), STEP_DUR * 0.9, when, audio.musicGain, 0.25);
    if (bass) beep(midi(bass), STEP_DUR * 1.5, when, audio.musicGain, 0.28, 'triangle');
  }

  function startMusic() {
    if (!soundOn) return;
    var a = ensureAudio();
    if (!a || musicTimer) return;
    musicStep = 0;
    nextNoteTime = a.ctx.currentTime + 0.05;
    musicTimer = window.setInterval(function () {
      while (nextNoteTime < a.ctx.currentTime + 0.15) {
        scheduleMusicStep(musicStep, nextNoteTime);
        musicStep++;
        nextNoteTime += STEP_DUR;
      }
    }, 40);
  }

  function stopMusic() {
    if (musicTimer) {
      window.clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  function toggleSound() {
    soundOn = !soundOn;
    if (!soundOn) {
      stopMusic();
    } else if (state === 'running') {
      startMusic();
    }
  }

  // ---------- 游戏逻辑 ----------
  function placeFood() {
    var occupied = {};
    var i;
    for (i = 0; i < snake.length; i++) {
      occupied[snake[i].x + ',' + snake[i].y] = true;
    }
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!occupied[x + ',' + y]) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function reset() {
    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    stepMs = 140;
    acc = 0;
    lastTime = 0;
    placeFood();
    updateHud();
  }

  function start() {
    reset();
    state = 'running';
    hideOverlay();
    sfxStart();
    startMusic();
  }

  function restart() {
    start();
  }

  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    stopMusic();
    showOverlay('PAUSED', '按 A / SPACE 继续', false);
  }

  function resume() {
    if (state !== 'paused') return;
    state = 'running';
    acc = 0;
    lastTime = 0;
    hideOverlay();
    startMusic();
  }

  function gameOver() {
    state = 'over';
    stopMusic();
    sfxOver();
    showOverlay('GAME OVER', 'SCORE ' + pad(score) + '\nHI ' + pad(hi) + '\n\n按 A / SPACE 重开', false);
  }

  function primary() {
    if (state === 'ready') start();
    else if (state === 'running') pause();
    else if (state === 'paused') resume();
    else if (state === 'over') start();
  }

  function turn(nx, ny) {
    if (state !== 'running') return;
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -last.x && ny === -last.y) return; // 禁止反向
    if (nx === last.x && ny === last.y) return;   // 重复方向无意义
    if (queue.length >= 2) return;
    queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) dir = queue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
      gameOver();
      return;
    }

    var grow = !!food && head.x === food.x && head.y === food.y;
    var limit = grow ? snake.length : snake.length - 1;

    // 撞自己（不吃食物时尾巴会让位）
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (grow) {
      sfxEat();
      score += 10;
      if (score > hi) {
        hi = score;
        writeHi();
      }
      stepMs = Math.max(80, 140 - Math.floor(score / 50) * 10);
      placeFood();
      updateHud();

      if (!food) {
        state = 'over';
        stopMusic();
        showOverlay('PERFECT!', '满屏通关\n\n按 A / SPACE 重开', false);
      }
    } else {
      snake.pop();
    }
  }

  // ---------- 渲染 ----------
  function draw() {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (food) {
      var fx = food.x * CELL;
      var fy = food.y * CELL;
      ctx.fillStyle = INK;
      ctx.fillRect(fx + 2, fy + 2, 4, 4);
      ctx.fillRect(fx + 1, fy + 3, 6, 2);
      ctx.fillRect(fx + 3, fy + 1, 2, 6);
    }

    for (var i = 0; i < snake.length; i++) {
      var s = snake[i];
      var x = s.x * CELL;
      var y = s.y * CELL;
      ctx.fillStyle = INK;
      ctx.fillRect(x, y, CELL, CELL);

      if (i === 0) {
        var eyes;
        if (dir.x === 1) eyes = [[5, 1], [5, 5]];
        else if (dir.x === -1) eyes = [[1, 1], [1, 5]];
        else if (dir.y === 1) eyes = [[1, 5], [5, 5]];
        else eyes = [[1, 1], [5, 1]];
        ctx.fillStyle = BG;
        for (var e = 0; e < eyes.length; e++) {
          ctx.fillRect(x + eyes[e][0], y + eyes[e][1], 2, 2);
        }
      }
    }
  }

  // ---------- 主循环 ----------
  function frame(t) {
    requestAnimationFrame(frame);

    if (state === 'running') {
      if (!lastTime) lastTime = t;
      var dt = t - lastTime;
      lastTime = t;
      if (dt > 200) dt = 200;
      acc += dt;

      while (acc >= stepMs && state === 'running') {
        acc -= stepMs;
        step();
      }
    } else {
      lastTime = 0;
      acc = 0;
    }

    draw();
  }

  // ---------- 输入 ----------
  var KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
  };

  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;

    if (KEYS[e.code]) {
      e.preventDefault();
      turn(KEYS[e.code][0], KEYS[e.code][1]);
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      primary();
    } else if (e.code === 'KeyR') {
      e.preventDefault();
      restart();
    } else if (e.code === 'KeyP') {
      e.preventDefault();
      if (state === 'running') pause();
      else if (state === 'paused') resume();
    } else if (e.code === 'KeyM') {
      e.preventDefault();
      toggleSound();
    }
  }, false);

  var dirButtons = document.querySelectorAll('[data-dir]');
  for (var b = 0; b < dirButtons.length; b++) {
    (function (btn) {
      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var d = btn.getAttribute('data-dir');
        if (d === 'up') turn(0, -1);
        else if (d === 'down') turn(0, 1);
        else if (d === 'left') turn(-1, 0);
        else turn(1, 0);
      });
    })(dirButtons[b]);
  }

  document.getElementById('btnA').addEventListener('click', primary);
  document.getElementById('btnB').addEventListener('click', restart);
  document.getElementById('btnStart').addEventListener('click', primary);
  document.getElementById('btnSelect').addEventListener('click', toggleSound);

  // ---------- 启动 ----------
  reset();
  state = 'ready';
  showOverlay('SNAKE', '方向键移动 · 吃豆变长\n\n按 A / SPACE 开始', true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
